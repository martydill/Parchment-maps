name: Package single HTML

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Package game
        run: npm run package

      - name: Upload single-file game
        uses: actions/upload-artifact@v4
        with:
          name: gilded-archipelago-single-html
          path: dist/gilded-archipelago.html
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/gilded-archipelago.html --generate-notes --verify-tag
