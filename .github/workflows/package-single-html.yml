name: Build release HTML

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run formatter
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Package game
        run: npm run package

      - name: Upload single-file game artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilded-archipelago-single-html
          path: dist/gilded-archipelago.html
          if-no-files-found: error

      - name: Create GitHub release from tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/gilded-archipelago.html
          --generate-notes --verify-tag

      - name: Attach HTML to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/gilded-archipelago.html --clobber
