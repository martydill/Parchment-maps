name: Automated voyages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:automation
      - name: Save screenshots and demo recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-voyage-artifacts
          path: .context/automation-tests/
          if-no-files-found: ignore
